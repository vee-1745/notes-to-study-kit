name: notes-to-study-kit
region: blr
services:
  - name: web
    environment_slug: python
    github:
      repo: YOUR_GITHUB_USERNAME/notes-to-study-kit
      branch: main
      deploy_on_push: true
    run_command: gunicorn --worker-tmp-dir /dev/shm -w 2 -b 0.0.0.0:8080 --timeout 120 app:app
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMMA_MODEL
        scope: RUN_TIME
        value: gemma-4-26b-a4b-it
      - key: RATE_LIMIT_PER_MIN
        scope: RUN_TIME
        value: "6"
